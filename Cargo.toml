[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.2"
publish = false

[workspace.dependencies]
evm-rpc = { path = "crates/evm-rpc" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
too_many_arguments = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
